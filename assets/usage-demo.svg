<svg width="1500" height="800" viewBox="0 0 1500 800" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="accent" x1="70" y1="70" x2="1430" y2="70" gradientUnits="userSpaceOnUse"><stop stop-color="#6D5DFB"/><stop offset="1" stop-color="#19C3E6"/></linearGradient>
    <filter id="shadow" x="-10%" y="-15%" width="120%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#111827" flood-opacity="0.1"/></filter>
  </defs>
  <rect width="1500" height="800" rx="28" fill="#0F172A"/>
  <circle cx="64" cy="48" r="8" fill="#FF6B6B"/><circle cx="90" cy="48" r="8" fill="#F7C948"/><circle cx="116" cy="48" r="8" fill="#5AD67D"/>
  <text x="750" y="55" text-anchor="middle" fill="#CBD5E1" font-family="Inter, Segoe UI, sans-serif" font-size="16" font-weight="650">seedance25-prompt-optimizer · demo</text>
  <rect x="54" y="86" width="1392" height="5" rx="2.5" fill="url(#accent)"/>
  <g filter="url(#shadow)"><rect x="70" y="132" width="1360" height="175" rx="22" fill="#172033"/><rect x="92" y="152" width="72" height="30" rx="15" fill="#302C57"/><text x="128" y="173" text-anchor="middle" fill="#B8ACFF" font-family="Inter, sans-serif" font-size="14" font-weight="750">USER</text><text x="94" y="219" fill="white" font-family="Inter, PingFang SC, Microsoft YaHei, sans-serif" font-size="24" font-weight="640">一只白色狐狸在雪山上回头看镜头，孤独、电影感。</text><text x="94" y="262" fill="#94A3B8" font-family="Inter, PingFang SC, Microsoft YaHei, sans-serif" font-size="16">一个简单创意，没有明确动作过程、光线、镜头、声音或结束状态。</text></g>
  <g filter="url(#shadow)"><rect x="70" y="345" width="1360" height="382" rx="22" fill="#F8FAFC"/><rect x="92" y="367" width="142" height="30" rx="15" fill="#EDE9FE"/><text x="163" y="388" text-anchor="middle" fill="#6D5DFB" font-family="Inter, sans-serif" font-size="14" font-weight="750">OPTIMIZED</text><text x="94" y="438" fill="#111827" font-family="Inter, PingFang SC, Microsoft YaHei, sans-serif" font-size="20" font-weight="700">优化后的 Seedance 2.5 提示词</text><text x="94" y="481" fill="#344054" font-family="Inter, PingFang SC, Microsoft YaHei, sans-serif" font-size="17">一只白色狐狸独自站在开阔的雪山山脊上，身体朝向远处山谷，四肢稳定踩在薄雪中。</text><text x="94" y="514" fill="#344054" font-family="Inter, PingFang SC, Microsoft YaHei, sans-serif" font-size="17">它先保持背对镜头的姿态，耳朵轻微转动，随后缓慢把头转向镜头，动作克制而自然；</text><text x="94" y="547" fill="#344054" font-family="Inter, PingFang SC, Microsoft YaHei, sans-serif" font-size="17">呼出的白色雾气短暂出现在鼻尖前，细风吹动颈部与尾部毛发，松散雪粒沿山脊掠过。</text><text x="94" y="588" fill="#344054" font-family="Inter, PingFang SC, Microsoft YaHei, sans-serif" font-size="17">画面采用冷灰蓝色冬日电影质感，低饱和自然光，远处群山与天空保留大量负空间，强化孤独感。</text><text x="94" y="621" fill="#344054" font-family="Inter, PingFang SC, Microsoft YaHei, sans-serif" font-size="17">镜头从稍远的中远景开始，缓慢稳定推近狐狸，始终保持主体完整、不切镜；结尾停在狐狸回望镜头的状态。</text><text x="94" y="654" fill="#344054" font-family="Inter, PingFang SC, Microsoft YaHei, sans-serif" font-size="17">声音只保留持续的山风、轻微雪粒摩擦声和狐狸踩雪时极轻的压雪声，不添加对白。</text><rect x="94" y="683" width="250" height="26" rx="13" fill="#E9FAFE"/><text x="219" y="702" text-anchor="middle" fill="#0787A8" font-family="Inter, sans-serif" font-size="13" font-weight="750">hard constraints preserved</text><rect x="356" y="683" width="230" height="26" rx="13" fill="#F1EEFF"/><text x="471" y="702" text-anchor="middle" fill="#5B4BDD" font-family="Inter, sans-serif" font-size="13" font-weight="750">low-risk details added</text></g>
</svg>
